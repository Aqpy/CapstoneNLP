version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development

  frontend:
    build:
      context: ./nlp
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./nlp:/app
    environment:
      - VITE_API_URL=http://localhost:5000